services:
  - type: web
    name: blindfold-bi-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: PYTHONPATH
        value: backend
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LLM_MODE
        value: on
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3.5-bolt-e4b
      - key: NVIDIA_API_KEY
        sync: false
      - key: MONDAY_API_TOKEN
        sync: false
      - key: MONDAY_DEALS_BOARD_ID
        sync: false
      - key: MONDAY_WO_BOARD_ID
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: API_KEY
        generateValue: true
      - key: API_KEY_PEPPER
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
