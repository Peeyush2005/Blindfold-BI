name: Deploy Blindfold BI to Microsoft Azure

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  # 1. Automated Quality Gate
  test-and-validate:
    name: Run Pytest Evals & Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Deterministic Backend Evals (Zero Math Drift)
        env:
          PYTHONPATH: backend
        run: |
          pytest -v

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build React 19 Production Bundle
        working-directory: ./frontend
        run: npm run build

  # 2. Deploy Frontend to Azure Static Web Apps
  deploy-frontend:
    name: Deploy UI to Azure Static Web Apps
    runs-on: ubuntu-latest
    needs: [test-and-validate]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build & Deploy Frontend
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/frontend"
          api_location: ""
          output_location: "dist"
          skip_deploy_on_missing_secrets: true

  # 3. Build & Deploy Backend Container to Azure Container Apps
  deploy-backend:
    name: Deploy Backend to Azure Container Apps
    runs-on: ubuntu-latest
    needs: [test-and-validate]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry (ACR)
        if: env.ACR_PASSWORD != ''
        uses: docker/login-action@v3
        env:
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER || 'skylarkbicr.azurecr.io' }}
          username: ${{ secrets.ACR_USERNAME || 'skylarkbicr' }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        env:
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        with:
          context: .
          file: ./Dockerfile
          push: ${{ env.ACR_PASSWORD != '' }}
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER || 'skylarkbicr.azurecr.io' }}/skylark-backend:latest
            ${{ secrets.ACR_LOGIN_SERVER || 'skylarkbicr.azurecr.io' }}/skylark-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to Azure CLI
        if: env.AZURE_CREDENTIALS != ''
        uses: azure/login@v2
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update Azure Container App
        if: env.AZURE_CREDENTIALS != ''
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          az containerapp update \
            --name skylark-bi-api \
            --resource-group rg-blindfold-bi-central \
            --image ${{ secrets.ACR_LOGIN_SERVER || 'skylarkbicr.azurecr.io' }}/skylark-backend:${{ github.sha }}
