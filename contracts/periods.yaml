version: "1.0.0"
fiscal_calendar:
  name: "Indian Fiscal Year"
  start_month: 4
  end_month: 3
  quarters:
    Q1:
      months: [4, 5, 6]
      name: "Q1 (April - June)"
    Q2:
      months: [7, 8, 9]
      name: "Q2 (July - September)"
    Q3:
      months: [10, 11, 12]
      name: "Q3 (October - December)"
    Q4:
      months: [1, 2, 3]
      name: "Q4 (January - March)"

default_as_of_date: "2026-03-01"

supported_relative_periods:
  - expression: "current fiscal year"
    aliases: ["this fy", "current fy", "fy25-26", "fy26"]
    maps_to: "FY25-26"
  - expression: "last fiscal year"
    aliases: ["previous fy", "last year", "fy24-25", "fy25"]
    maps_to: "FY24-25"
  - expression: "current quarter"
    aliases: ["this quarter", "q4"]
    maps_to: "Q4"
  - expression: "year to date"
    aliases: ["ytd", "fiscal ytd"]
    maps_to: "YTD"
