# evals/questions.yaml
# 30 Evaluation questions for Blindfold BI across paraphrase groups, distinct intents, and edge cases.

questions:
  # Paraphrase Group 1: Energy Sector Pipeline in Q4
  - id: Q01
    question: "How's our pipeline looking for the energy sector this quarter?"
    group: energy_pipeline_q4
    expected_task: lookup
    expected_tool: pipeline_summary
    expected_args:
      sector: "Energy"
      sector_group: "Energy"
      period: "Q4 FY25-26"
    expected_primary: "open_pipeline"
    coverage_caveat: true

  - id: Q02
    question: "What is the open pipeline for energy in Q4 FY25-26?"
    group: energy_pipeline_q4
    expected_task: lookup
    expected_tool: pipeline_summary
    expected_args:
      sector: "Energy"
      period: "Q4 FY25-26"
    expected_primary: "open_pipeline"
    coverage_caveat: true

  - id: Q03
    question: "Show me Q4 energy pipeline opportunities and valuation."
    group: energy_pipeline_q4
    expected_task: lookup
    expected_tool: pipeline_summary
    expected_args:
      sector: "Energy"
      period: "Q4 FY25-26"
    expected_primary: "open_pipeline"
    coverage_caveat: true

  # Paraphrase Group 2: Sector Ranking (Top 1 / Biggest Pipeline)
  - id: Q04
    question: "Which sector has the biggest open pipeline?"
    group: sector_ranking
    expected_task: rank
    expected_tool: sector_performance
    expected_args:
      metric: "open_pipeline"
      top_n: 1
    expected_primary: "top_sector"

  - id: Q05
    question: "Rank sectors by open pipeline value."
    group: sector_ranking
    expected_task: rank
    expected_tool: sector_performance
    expected_args:
      metric: "open_pipeline"
    expected_primary: "sector_ranking"

  - id: Q06
    question: "What is our top sector by pipeline opportunity size?"
    group: sector_ranking
    expected_task: rank
    expected_tool: sector_performance
    expected_args:
      metric: "open_pipeline"
      top_n: 1
    expected_primary: "top_sector"

