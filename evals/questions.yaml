    group: tender_concentration
    expected_task: lookup
    expected_tool: pipeline_summary
    expected_args:
      deal_type: "Tender"
    expected_primary: "tender_share_pct"
    oracle_value: "77.3%"

  - id: Q08
    question: "What percentage of open deals are tender bids?"
    group: tender_concentration
    expected_task: lookup
    expected_tool: pipeline_summary
    expected_args:
